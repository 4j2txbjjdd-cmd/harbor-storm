# Cloud Run service for the competition demo.
#
# Pinned to exactly one instance. This is a demo-integrity decision, not a
# scaling one: Firestore event ids are ordered by a monotonic per-process
# clock with no shared counter (see app/core/firestore_store.py), so a second
# instance could make the trace *display* PLAN_COMMITTED before PLAN_VERIFIED
# while the state stayed correct. That pair is the one thing the demo exists
# to show, and it is read off the trace by a judge. One instance removes the
# possibility entirely. Raising maxScale means fixing the ordering first.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: harbor-storm
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 120
      containers:
        - image: REPLACED_AT_DEPLOY
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: STATE_BACKEND
              value: "firestore"
            - name: WEATHER_PROVIDER
              value: "mock"
            - name: LOG_LEVEL
              value: "INFO"
            # Set WEATHER_PROVIDER=google and supply the key as a secret to go
            # live. app/config.py refuses to start if one is set without the other.
            # - name: GOOGLE_WEATHER_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: google-weather-api-key
            #       key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
